[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = [
  "tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".venv",
  "downloads",
  "screenshots",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = '(^downloads/|^screenshots/|^\.venv/)'
