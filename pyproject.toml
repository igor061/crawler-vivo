[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-vivo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.58.0",
    "scrapling==0.2.99",
    "pypdf>=6.16.2",
]

[project.scripts]
vivo-movel   = "vivo_movel:main"
vivo-fixo    = "vivo_fixo:main"
vivo-extrator = "vivo_fatura_extrator:main"

[tool.setuptools]
py-modules = [
    "vivo_core",
    "vivo_movel",
    "vivo_fixo",
    "vivo_fatura_extrator",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = [
  "tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".venv",
  "downloads",
  "screenshots",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = '(^downloads/|^screenshots/|^\.venv/)'
